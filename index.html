<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fasr Kitchen & Bar | Order Online</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="sync.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-28">

  <!-- Sticky Top Header -->
  <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-200 px-4 py-3 flex items-center justify-between shadow-xs">
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-2xl bg-orange-600 text-white flex items-center justify-center font-black text-xl shadow-md">F</div>
      <div>
        <h1 class="text-sm font-extrabold tracking-tight text-slate-900 leading-none">Fasr Orders</h1>
        <p class="text-[11px] font-medium text-slate-500 mt-0.5">Ethiopian Kitchen & Bar</p>
      </div>
    </div>
    <div class="flex items-center gap-2">
      <div id="table-badge" class="px-3 py-1 bg-orange-50 border border-orange-200 text-orange-700 text-xs font-bold rounded-xl flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-orange-500"></span>
        <span id="active-table-text">Table 04</span>
      </div>
      <button onclick="openTablePicker()" class="p-2 text-slate-400 hover:text-slate-600 rounded-xl hover:bg-slate-100 transition-colors">
        <svg class="w-4 h-4 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      </button>
    </div>
  </header>

  <!-- Active Order Live Tracker Banner -->
  <div id="live-tracker-banner" class="hidden px-4 mt-4">
    <div class="bg-slate-900 text-white rounded-2xl p-4 shadow-xl border border-slate-800 flex items-center justify-between">
      <div>
        <div class="flex items-center gap-2">
          <span class="relative flex h-2.5 w-2.5">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
          </span>
          <span class="text-[11px] font-extrabold tracking-wider uppercase text-emerald-400" id="tracker-ticket">TICKET FS-828</span>
        </div>
        <p class="text-xs font-semibold text-slate-300 mt-1" id="tracker-status">In Kitchen: Preparing your dishes</p>
      </div>
      <button onclick="openTrackerModal()" class="px-3 py-1.5 bg-white/10 hover:bg-white/20 text-white rounded-xl text-xs font-bold transition-all">Track</button>
    </div>
  </div>

  <!-- Category Nav -->
  <div class="px-4 mt-4">
    <div class="flex gap-2 overflow-x-auto pb-1 no-scrollbar text-xs font-bold" id="cat-chips">
      <button onclick="filterCategory('all')" class="cat-btn active px-4 py-2 rounded-xl bg-orange-600 text-white shadow-xs">All Dishes</button>
      <button onclick="filterCategory('lunch')" class="cat-btn px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 hover:bg-slate-100">Lunch</button>
      <button onclick="filterCategory('dinner')" class="cat-btn px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 hover:bg-slate-100">Dinner</button>
      <button onclick="filterCategory('fast_food')" class="cat-btn px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 hover:bg-slate-100">Fast Food</button>
      <button onclick="filterCategory('beverages')" class="cat-btn px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 hover:bg-slate-100">Beverages</button>
      <button onclick="filterCategory('dessert')" class="cat-btn px-4 py-2 rounded-xl bg-white border border-slate-200 text-slate-600 hover:bg-slate-100">Dessert</button>
    </div>
  </div>

  <!-- Menu Grid -->
  <main class="px-4 mt-5">
    <div id="menu-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
      <!-- Injected by JavaScript -->
    </div>
  </main>

  <!-- Sticky Bottom Cart Button -->
  <div id="cart-float-bar" class="fixed bottom-4 inset-x-4 max-w-lg mx-auto z-40 hidden">
    <button onclick="toggleCartDrawer(true)" class="w-full bg-slate-900 text-white p-4 rounded-3xl shadow-2xl flex items-center justify-between hover:bg-slate-800 transition-all">
      <div class="flex items-center gap-3">
        <span id="cart-pill-count" class="w-7 h-7 bg-orange-600 rounded-full flex items-center justify-center text-xs font-black">0</span>
        <span class="text-xs font-bold text-slate-300">View Selected Order</span>
      </div>
      <div class="text-sm font-black text-white" id="cart-pill-total">Br 0.00</div>
    </button>
  </div>

  <!-- Cart Drawer Modal -->
  <div id="cart-drawer" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-xs flex items-end justify-center hidden">
    <div class="bg-white rounded-t-3xl max-w-lg w-full max-h-[85vh] flex flex-col p-6 shadow-2xl animate-in slide-in-from-bottom duration-300">
      <div class="flex items-center justify-between pb-4 border-b border-slate-100">
        <div>
          <h2 class="text-base font-extrabold text-slate-900">Your Ticket</h2>
          <p class="text-xs text-slate-400 mt-0.5" id="cart-table-info">Table 04</p>
        </div>
        <button onclick="toggleCartDrawer(false)" class="p-2 text-slate-400 hover:text-slate-600 rounded-full hover:bg-slate-100">
          <svg class="w-5 h-5 fill-none stroke-current stroke-2" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div id="cart-items-list" class="flex-1 overflow-y-auto py-4 space-y-3 divide-y divide-slate-100">
        <!-- Rendered items -->
      </div>

      <div class="pt-4 border-t border-slate-100 space-y-2 text-xs">
        <div class="flex justify-between text-slate-500">
          <span>Subtotal</span>
          <span id="cart-subtotal" class="font-bold">Br 0.00</span>
        </div>
        <div class="flex justify-between text-slate-500">
          <span>VAT (10%)</span>
          <span id="cart-tax" class="font-bold">Br 0.00</span>
        </div>
        <div class="flex justify-between text-base font-black text-slate-900 pt-1">
          <span>Total</span>
          <span id="cart-total" class="text-orange-600">Br 0.00</span>
        </div>
        <button id="submit-order-btn" onclick="submitOrder()" class="w-full mt-3 py-3.5 bg-orange-600 hover:bg-orange-700 active:scale-95 text-white font-extrabold text-sm rounded-2xl shadow-lg transition-all">
          Confirm & Send to Kitchen
        </button>
      </div>
    </div>
  </div>

  <script>
    let activeCategory = 'all';
    let currentTable = 'Table 04';
    let cart = {};
    let trackedOrderId = localStorage.getItem('fasr_active_order_id') || null;

    window.addEventListener('DOMContentLoaded', async () => {
      // URL Parameter overrides: ?table=7 or ?orderId=uuid
      const params = new URLSearchParams(window.location.search);
      if (params.get('table')) {
        currentTable = `Table ${params.get('table').padStart(2, '0')}`;
      }
      if (params.get('orderId')) {
        trackedOrderId = params.get('orderId');
        localStorage.setItem('fasr_active_order_id', trackedOrderId);
      }

      document.getElementById('active-table-text').innerText = currentTable;
      document.getElementById('cart-table-info').innerText = currentTable;

      await window.fasrSync.ready;
      renderMenu();
      checkActiveOrder();

      window.fasrSync.subscribe((event) => {
        if (event.type === 'MENU_CHANGED') renderMenu();
        if (event.type === 'ORDER_STATUS_CHANGED' && event.payload.orderId === trackedOrderId) {
          checkActiveOrder();
          if (event.payload.status === 'ready') window.fasrSound.playReadyAlarm();
        }
      });
    });

    function renderMenu() {
      const items = window.fasrSync.getMenu();
      const grid = document.getElementById('menu-grid');
      const filtered = activeCategory === 'all' ? items : items.filter(i => i.category === activeCategory);

      grid.innerHTML = filtered.map(item => `
        <div class="bg-white rounded-3xl p-3.5 border border-slate-200/80 shadow-xs flex flex-col justify-between ${!item.inStock ? 'opacity-50 grayscale' : ''}">
          <div class="relative aspect-4/3 rounded-2xl overflow-hidden bg-slate-100">
            <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
            ${!item.inStock ? '<span class="absolute top-2 right-2 px-2 py-1 bg-rose-600 text-white font-black text-[10px] rounded-lg uppercase">Sold Out</span>' : ''}
          </div>
          <div class="mt-3 flex-1">
            <div class="flex items-start justify-between gap-1">
              <h3 class="text-sm font-extrabold text-slate-900 leading-snug">${item.name}</h3>
              <span class="text-sm font-black text-orange-600 shrink-0">Br ${parseFloat(item.price).toFixed(2)}</span>
            </div>
            <p class="text-[11px] text-slate-500 mt-1 line-clamp-2">${item.description || ''}</p>
          </div>
          <button onclick="addToCart('${item.id}')" ${!item.inStock ? 'disabled' : ''} class="mt-3 w-full py-2.5 rounded-xl font-bold text-xs flex items-center justify-center gap-1.5 ${item.inStock ? 'bg-orange-50 hover:bg-orange-600 text-orange-700 hover:text-white transition-all' : 'bg-slate-100 text-slate-400 cursor-not-allowed'}">
            <span>Add to Ticket</span>
          </button>
        </div>
      `).join('');
    }

    function filterCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.getAttribute('onclick').includes(cat));
        btn.classList.toggle('bg-orange-600', btn.getAttribute('onclick').includes(cat));
        btn.classList.toggle('text-white', btn.getAttribute('onclick').includes(cat));
        btn.classList.toggle('bg-white', !btn.getAttribute('onclick').includes(cat));
        btn.classList.toggle('text-slate-600', !btn.getAttribute('onclick').includes(cat));
      });
      renderMenu();
    }

    function addToCart(itemId) {
      const items = window.fasrSync.getMenu();
      const dish = items.find(i => i.id === itemId);
      if (!dish || !dish.inStock) return;

      cart[itemId] = (cart[itemId] || 0) + 1;
      window.fasrSound.playBeep();
      updateCartUI();
    }

    function updateCartUI() {
      const menu = window.fasrSync.getMenu();
      const keys = Object.keys(cart);
      let totalQty = 0;
      let subtotal = 0;

      const list = document.getElementById('cart-items-list');
      list.innerHTML = '';

      keys.forEach(id => {
        const item = menu.find(i => i.id === id);
        const qty = cart[id];
        if (item && qty > 0) {
          totalQty += qty;
          subtotal += item.price * qty;
          list.innerHTML += `
            <div class="pt-3 first:pt-0 flex items-center justify-between">
              <div>
                <p class="text-xs font-bold text-slate-900">${item.name}</p>
                <p class="text-[11px] text-slate-400 font-semibold">Br ${item.price} each</p>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="adjustCart('${id}', -1)" class="w-6 h-6 rounded-lg bg-slate-100 flex items-center justify-center font-bold text-xs text-slate-600 hover:bg-slate-200">-</button>
                <span class="text-xs font-bold text-slate-900 w-4 text-center">${qty}</span>
                <button onclick="adjustCart('${id}', 1)" class="w-6 h-6 rounded-lg bg-slate-100 flex items-center justify-center font-bold text-xs text-slate-600 hover:bg-slate-200">+</button>
              </div>
            </div>
          `;
        }
      });

      const tax = subtotal * 0.10;
      const total = subtotal + tax;

      document.getElementById('cart-subtotal').innerText = `Br ${subtotal.toFixed(2)}`;
      document.getElementById('cart-tax').innerText = `Br ${tax.toFixed(2)}`;
      document.getElementById('cart-total').innerText = `Br ${total.toFixed(2)}`;
      document.getElementById('cart-pill-total').innerText = `Br ${total.toFixed(2)}`;
      document.getElementById('cart-pill-count').innerText = totalQty;

      document.getElementById('cart-float-bar').classList.toggle('hidden', totalQty === 0);
      if (totalQty === 0) toggleCartDrawer(false);
    }

    function adjustCart(id, delta) {
      if (!cart[id]) return;
      cart[id] += delta;
      if (cart[id] <= 0) delete cart[id];
      updateCartUI();
    }

    function toggleCartDrawer(show) {
      document.getElementById('cart-drawer').classList.toggle('hidden', !show);
    }

    async function submitOrder() {
      const itemsPayload = Object.keys(cart).map(id => ({
        id,
        quantity: cart[id]
      }));

      const submitBtn = document.getElementById('submit-order-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Transmitting to Kitchen...';

      try {
        const order = await window.fasrSync.createOrder({
          tableNumber: currentTable,
          customerName: 'Dine In Diner',
          items: itemsPayload
        });

        cart = {};
        updateCartUI();
        toggleCartDrawer(false);

        trackedOrderId = order.id;
        localStorage.setItem('fasr_active_order_id', order.id);
        window.fasrSound.playCashierDing();
        window.showToast("Order placed successfully!", "success");
        checkActiveOrder();
      } catch (e) {
        window.showToast(e.message, "error");
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Confirm & Send to Kitchen';
      }
    }

    function checkActiveOrder() {
      if (!trackedOrderId) return;
      const orders = window.fasrSync.getOrders();
      const order = orders.find(o => o.id === trackedOrderId);
      if (!order) return;

      const banner = document.getElementById('live-tracker-banner');
      banner.classList.remove('hidden');
      document.getElementById('tracker-ticket').innerText = `TICKET ${order.ticketNumber}`;

      const statusMap = {
        kitchen: "In Kitchen: Food is being cooked",
        ready: "Ready for Pickup at the counter!",
        served: "Order Complete! Enjoy your meal.",
        cancelled: "Order cancelled."
      };
      document.getElementById('tracker-status').innerText = statusMap[order.status] || order.status;
    }

    function openTrackerModal() {
      const orders = window.fasrSync.getOrders();
      const order = orders.find(o => o.id === trackedOrderId);
      if (!order) return;

      window.showInPageModal({
        title: `Order Status: ${order.ticketNumber}`,
        content: `
          <div class="space-y-3">
            <p class="font-bold text-sm text-orange-600 uppercase tracking-wider">${order.status.toUpperCase()}</p>
            <div class="p-3 bg-slate-50 dark:bg-slate-800 rounded-xl space-y-1">
              ${order.items.map(i => `<div class="flex justify-between text-xs"><span>${i.quantity}x ${i.name}</span><span class="font-bold">Br ${(i.price * i.quantity).toFixed(2)}</span></div>`).join('')}
            </div>
            <div class="flex justify-between font-extrabold text-sm pt-1">
              <span>Total Bill</span>
              <span>Br ${order.total.toFixed(2)}</span>
            </div>
          </div>
        `,
        confirmText: "Close"
      });
    }

    function openTablePicker() {
      const input = prompt("Enter Table Number (e.g., 04, 12, Patio):", currentTable.replace('Table ', ''));
      if (input) {
        currentTable = `Table ${input.trim()}`;
        document.getElementById('active-table-text').innerText = currentTable;
        document.getElementById('cart-table-info').innerText = currentTable;
      }
    }
  </script>
</body>
</html>
